<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="The wedding of Ahmad & Aisyah — 12 December 2026, Bandung, Indonesia." />
  <title>Ahmad &amp; Aisyah — Wedding Invitation</title>

  <!-- Fonts: Cormorant Garamond (headings) + Poppins (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <!-- Stylesheets: design system -> responsive -> animation -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/animation.css" />
</head>
<body>
  <!-- ===================== NAVIGATION ===================== -->
  <header class="nav" id="nav">
    <div class="nav__inner container">
      <a href="#hero" class="nav__brand" aria-label="Ahmad and Aisyah wedding home">
        <span class="nav__brand-mark">Ahmad &amp; Aisyah</span>
      </a>
      <nav class="nav__links" id="navLinks" aria-label="Primary">
        <a href="#hero" class="nav__link">Home</a>
        <a href="#couple" class="nav__link">Couple</a>
        <a href="#story" class="nav__link">Story</a>
        <a href="#event" class="nav__link">Event</a>
        <a href="#gallery" class="nav__link">Gallery</a>
        <a href="#rsvp" class="nav__link">RSVP</a>
      </nav>
      <button class="nav__toggle" id="navToggle" aria-label="Open menu" aria-expanded="false" aria-controls="navLinks">
        <span class="nav__toggle-bar"></span>
        <span class="nav__toggle-bar"></span>
        <span class="nav__toggle-bar"></span>
      </button>
    </div>
  </header>

  <main>
    <!-- ===================== HERO ===================== -->
    <section class="hero" id="hero">
      <!-- Botanical line art — top-left corner -->
      <svg class="botanical botanical--tl" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
        <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 10 C 40 30, 50 70, 45 120 C 43 150, 50 175, 60 195" />
          <path d="M10 10 C 30 25, 35 50, 30 80" />
          <ellipse cx="22" cy="28" rx="11" ry="4" transform="rotate(35 22 28)" />
          <ellipse cx="18" cy="45" rx="11" ry="4" transform="rotate(55 18 45)" />
          <ellipse cx="38" cy="62" rx="12" ry="4.5" transform="rotate(25 38 62)" />
          <ellipse cx="32" cy="85" rx="11" ry="4" transform="rotate(48 32 85)" />
          <ellipse cx="48" cy="105" rx="12" ry="4.5" transform="rotate(30 48 105)" />
          <ellipse cx="42" cy="130" rx="11" ry="4" transform="rotate(52 42 130)" />
          <ellipse cx="55" cy="155" rx="10" ry="4" transform="rotate(35 55 155)" />
          <ellipse cx="52" cy="178" rx="9" ry="3.5" transform="rotate(48 52 178)" />
          <circle cx="30" cy="18" r="2.5" />
          <circle cx="50" cy="95" r="2" />
        </g>
      </svg>

      <!-- Botanical line art — bottom-right corner -->
      <svg class="botanical botanical--br" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
        <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M190 190 C 160 170, 150 130, 155 80 C 157 50, 150 25, 140 5" />
          <path d="M190 190 C 170 175, 165 150, 170 120" />
          <ellipse cx="178" cy="172" rx="11" ry="4" transform="rotate(-35 178 172)" />
          <ellipse cx="182" cy="155" rx="11" ry="4" transform="rotate(-55 182 155)" />
          <ellipse cx="162" cy="138" rx="12" ry="4.5" transform="rotate(-25 162 138)" />
          <ellipse cx="168" cy="115" rx="11" ry="4" transform="rotate(-48 168 115)" />
          <ellipse cx="152" cy="95" rx="12" ry="4.5" transform="rotate(-30 152 95)" />
          <ellipse cx="158" cy="70" rx="11" ry="4" transform="rotate(-52 158 70)" />
          <ellipse cx="145" cy="45" rx="10" ry="4" transform="rotate(-35 145 45)" />
          <ellipse cx="148" cy="22" rx="9" ry="3.5" transform="rotate(-48 148 22)" />
          <circle cx="170" cy="182" r="2.5" />
          <circle cx="150" cy="95" r="2" />
        </g>
      </svg>

      <div class="hero__inner container">
        <!-- Left: typography -->
        <div class="hero__content">
          <p class="hero__eyebrow eyebrow reveal reveal--fade">The Wedding Of</p>

          <h1 class="hero__names">
            <span class="hero__name reveal reveal--up reveal--delay-1">Ahmad</span>
            <span class="hero__amp reveal reveal--fade reveal--delay-2" aria-hidden="true">&amp;</span>
            <span class="hero__name reveal reveal--up reveal--delay-3">Aisyah</span>
          </h1>

          <div class="hero__divider divider reveal reveal--fade reveal--delay-3" aria-hidden="true"></div>

          <p class="hero__date reveal reveal--up reveal--delay-4">12 December 2026</p>

          <p class="hero__message reveal reveal--fade reveal--delay-5">
            With joyful hearts,<br />
            we invite you to celebrate<br />
            the beginning of our forever.
          </p>
        </div>

        <!-- Right: couple photograph -->
        <div class="hero__photo-wrap reveal reveal--fade reveal--delay-2">
          <div class="hero__photo-frame">
            <img
              class="hero__photo"
              src="https://images.pexels.com/photos/30822486/pexels-photo-30822486.jpeg?auto=compress&cs=tinysrgb&w=900"
              alt="Ahmad and Aisyah embracing outdoors in soft evening light"
              width="900"
              height="1350"
              loading="eager"
            />
          </div>
        </div>

        <!-- CTA (after photo on mobile, under text on desktop) -->
        <div class="hero__cta reveal reveal--up reveal--delay-6">
          <a href="#couple" class="btn btn--invitation">
            <span>Open Invitation</span>
          </a>
        </div>
      </div>

      <!-- Guest personalization -->
      <div class="hero__guest reveal reveal--fade reveal--delay-6">
        <p class="hero__guest-label">Kepada Yth.</p>
        <p class="hero__guest-name" id="guestName">Bapak/Ibu Tamu Undangan</p>
      </div>

      <!-- Scroll indicator -->
      <a href="#couple" class="hero__scroll" aria-label="Scroll to couple section">
        <span class="hero__scroll-text">Scroll</span>
        <span class="hero__scroll-line" aria-hidden="true"></span>
      </a>
    </section>
  </main>

  <!-- Scripts: modular, deferred so HTML parses first -->
  <script src="js/main.js" defer></script>
</body>
</html>
